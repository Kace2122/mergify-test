queue_rules:
  - name: default
    queue_conditions:
      - base = main

merge_protections:
  - name: require approval and checks
    if:
      - base = main
    success_conditions:
      - "#approved-reviews-by >= 1"
      - check-success = ci
  - name: p-neg
    if:
      - base = main
    success_conditions:
      - "-#approved-reviews-by >= 1"
  - name: p-space
    if:
      - base = main
    success_conditions:
      - "base  =  main"
  - name: p-dquote
    if:
      - base = main
    success_conditions:
      - 'base = "main"'
  - name: p-or-list
    if:
      - base = main
    success_conditions:
      - - label = probe-missing
        - base = main
  - name: p-neq
    if:
      - base = main
    success_conditions:
      - "base != develop"
merge_protections_settings:
  auto_merge_conditions: true
